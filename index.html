<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Boletim Digital</h1>
    <div id="infoAluno">
      <span id="turmaExibicao">Turma: 8C</span> | 
      <span id="chamadaExibicao">Nº: 8</span>
    </div>
  </header>

  <main>
    <section id="secaoLogin" class="card-login">
      <h2>Acesso ao Boletim</h2>
      <form id="formLogin">
        <label for="pinInput">Digite seu PIN:</label>
        <input type="password" id="pinInput" maxlength="10" required placeholder="Digite o PIN">
        <button type="submit" id="btnEntrar">Entrar</button>
      </form>
      <div id="mensagemLogin" class="mensagem"></div>
    </section>

    <section id="secaoBoletim" class="escondido">
      <div class="acoes-boletim">
        <button id="btnEditar">Alterar dados</button>
      </div>

      <section class="area-graficos">
        <article class="grafico-card">
          <h2>Média por disciplina</h2>
          <div class="grafico-container">
            <canvas id="graficoMediasDisciplinas"></canvas>
          </div>
        </article>

        <article class="grafico-card">
          <h2>Evolução da média geral</h2>
          <div class="grafico-container">
            <canvas id="graficoEvolucaoTrimestres"></canvas>
          </div>
        </article>

        <article class="grafico-card">
          <h2>Faltas por trimestre</h2>
          <div id="estadoFaltas"></div>
          <div class="grafico-container">
            <canvas id="graficoFaltasTrimestres"></canvas>
          </div>
        </article>
      </section>

      <section class="cards-disciplinas" id="containerCards"></section>

      <section class="tabela-container">
        <h2>Tabela de Disciplinas</h2>
        <table id="tabelaDisciplinas">
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </section>
    </section>

    <section id="secaoEditor" class="escondido">
      <h2>Editar Notas e Faltas</h2>
      <form id="formEditor">
        <div id="camposEditor"></div>
        <div class="botoes-editor">
          <button type="button" id="btnCancelar">Cancelar</button>
          <button type="submit" id="btnSalvar">Salvar alterações</button>
        </div>
      </form>
      <div id="mensagemEditor" class="mensagem"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
